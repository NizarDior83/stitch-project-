name: Build Android APK

# The APK is built here rather than locally because GitHub's ubuntu runners
# ship with the Android SDK preinstalled.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shipmart/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shipmart/package-lock.json

      - name: Install web dependencies
        working-directory: shipmart
        run: npm ci

      - name: Type-check
        working-directory: shipmart
        run: npx tsc --noEmit

      # Produces shipmart/out/ — the static site the APK bundles as assets.
      - name: Export the static site
        working-directory: shipmart
        run: npm run export

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      # copyWebAssets (in app/build.gradle.kts) pulls shipmart/out into the APK.
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename the APK with the run number
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/shipmart-debug-${{ github.run_number }}.apk"
          ls -la dist

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: shipmart-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summarise
        run: |
          SIZE=$(du -h dist/*.apk | cut -f1)
          {
            echo "### Shipmart APK built"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`shipmart-debug-${{ github.run_number }}.apk\` |"
            echo "| Size | $SIZE |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Download it from the **Artifacts** section at the bottom of this run."
            echo ""
            echo "Debug-signed — fine for sideloading and testing, not for the Play Store."
          } >> "$GITHUB_STEP_SUMMARY"
